name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Run parser tests
        run: make test
      - name: Run proxy integration test
        run: make integration
      - name: Run sanitizer tests
        run: make sanitize
      - name: Build fuzz harness
        run: make fuzz-build
