name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TLS dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build
        run: make

      - name: Build TLS target
        run: make tls

      - name: Run parser tests
        run: make test

      - name: Run proxy integration test
        run: make integration


      - name: Validate benchmark metric parsing
        run: |
          python3 - <<'PY'
          from tools.benchmark_suite import test_parse_metric_rejects_non_finite_values, test_parse_metric_rejects_missing_metric
          test_parse_metric_rejects_non_finite_values()
          test_parse_metric_rejects_missing_metric()
          PY

      - name: Run sanitizer tests
        run: make sanitize

      - name: Build fuzz harness
        run: make fuzz-build
